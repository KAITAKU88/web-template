name = "web-template-cloudflare"
account_id = "37bf38733c50498a991caa8d3b2248c7"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Custom entry point: wraps OpenNext + thêm Cloudflare Cron Triggers
# Build trước bằng `npx @opennextjs/cloudflare build`, sau đó wrangler bundle file này
main = "src/cf-worker.ts"

# Chạy cron jobs mỗi 5 phút — không cần dịch vụ ngoài
[triggers]
crons = ["*/5 * * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[observability.logs]
enabled = true

[vars]
# Production env vars được set trong Cloudflare Dashboard, không hardcode ở đây
# Cloudflare Dashboard → Pages → Project → Settings → Environment variables
